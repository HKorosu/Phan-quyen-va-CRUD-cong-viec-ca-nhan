<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đăng nhập</title></head>
<body>
<h1>Đăng nhập</h1>
<p th:if="${param.error}">Tên đăng nhập hoặc mật khẩu không đúng.</p>
<p th:if="${param.logout}">Bạn đã đăng xuất.</p>
<p th:if="${param.registered}">Đăng ký thành công. Hãy đăng nhập.</p>
<form th:action="@{/login}" method="post">
    <p><label for="username">Tên đăng nhập</label><input id="username" name="username" required autocomplete="username"></p>
    <p><label for="password">Mật khẩu</label><input id="password" name="password" type="password" required autocomplete="current-password"></p>
    <button type="submit">Đăng nhập</button>
</form>
<a th:href="@{/register}">Tạo tài khoản học viên</a>
</body>
</html>
